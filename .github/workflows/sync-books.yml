name: Sync books from Readwise

on:
  schedule:
    - cron: '17 14 * * 1'   # Mondays, 14:17 UTC (6:17am Pacific)
  workflow_dispatch:        # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull books
        env:
          BOOKS_PUBLIC_TOKEN: ${{ secrets.BOOKS_PUBLIC_TOKEN }}
        run: node scripts/sync-books.mjs
      - name: Commit if changed
        run: |
          git config user.name "books-sync"
          git config user.email "books-sync@users.noreply.github.com"
          git add src/data/books.json src/data/lookup-cache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync books from Readwise"
            git push
          fi
